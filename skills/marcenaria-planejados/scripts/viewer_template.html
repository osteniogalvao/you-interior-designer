<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__ - 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2f1ee; font: 13px system-ui, sans-serif; color: #222; }
  #app { position: fixed; inset: 0; }
  #painel { position: fixed; top: 10px; left: 10px; background: rgba(255,255,255,.94); border-radius: 8px;
            padding: 10px 12px; max-width: 280px; max-height: calc(100% - 40px); overflow: auto;
            box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #painel h1 { font-size: 15px; margin: 0 0 8px; }
  #painel h2 { font-size: 12px; margin: 10px 0 4px; text-transform: uppercase; color: #666; }
  #painel button { margin: 2px 2px 2px 0; padding: 4px 8px; border: 1px solid #bbb; background: #fff;
                   border-radius: 4px; cursor: pointer; font-size: 12px; }
  #painel label { display: block; margin: 2px 0; cursor: pointer; }
  #info { position: fixed; bottom: 10px; left: 10px; right: 10px; background: rgba(255,255,255,.94);
          border-radius: 8px; padding: 8px 12px; min-height: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="painel">
  <h1>__TITULO__</h1>
  <h2>Câmera</h2>
  <div id="cams"></div>
  <h2>Grupos</h2>
  <div id="grupos"></div>
  <h2>Exibir</h2>
  <label><input type="checkbox" id="chkParedes" checked> Paredes</label>
  <label><input type="checkbox" id="chkArestas" checked> Arestas</label>
</div>
<div id="info">Passe o mouse sobre uma peça para ver as medidas (mm).</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const DADOS = /*__DADOS__*/null;
const amb = DADOS.ambiente, PD = amb.pe_direito || 2600;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById("app").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f1ee);
const camera = new THREE.PerspectiveCamera(45, 1, 10, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 1.4); sol.position.set(4000, 6000, 5000); scene.add(sol);

// modelo: X, Y (profundidade), Z (altura)  ->  three: x, y=altura, z=profundidade
const P = (x, y, z) => new THREE.Vector3(x, z, y);

// piso e paredes a partir do polígono
const paredes = new THREE.Group(); scene.add(paredes);
const poly = amb.poligono || [];
let bb = new THREE.Box3();
if (poly.length >= 3) {
  const sh = new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, y)));
  const piso = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshLambertMaterial({ color: 0xd8d2c8, side: THREE.DoubleSide }));
  piso.rotation.x = Math.PI / 2; scene.add(piso);
  const matP = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
  for (let i = 0; i < poly.length; i++) {
    const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];
    const L = Math.hypot(x1 - x0, y1 - y0);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(L, PD), matP);
    m.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, PD / 2));
    m.rotation.y = -Math.atan2(y1 - y0, x1 - x0);
    paredes.add(m);
  }
  poly.forEach(([x, y]) => { bb.expandByPoint(P(x, y, 0)); bb.expandByPoint(P(x, y, PD)); });
}

// peças
const grupos = {}, alvos = [];
const arestasMat = new THREE.LineBasicMaterial({ color: 0x333333 });
const todasArestas = [];
for (const p of DADOS.pecas) {
  const g = new THREE.BoxGeometry(p.dx, p.dz, p.dy);
  const mat = new THREE.MeshLambertMaterial({ color: p.cor, transparent: p.mat_key === "vidro", opacity: p.mat_key === "vidro" ? 0.35 : 1 });
  const m = new THREE.Mesh(g, mat);
  m.position.copy(P(p.x + p.dx / 2, p.y + p.dy / 2, p.z + p.dz / 2));
  m.userData = p;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), arestasMat);
  m.add(e); todasArestas.push(e);
  (grupos[p.grupo] ||= new THREE.Group()).add(m);
  alvos.push(m);
  bb.expandByObject(m);
}
Object.values(grupos).forEach(g => scene.add(g));

// UI: grupos
const divG = document.getElementById("grupos");
for (const nome of Object.keys(grupos)) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked> ${nome}`;
  l.querySelector("input").onchange = ev => { grupos[nome].visible = ev.target.checked; };
  divG.appendChild(l);
}
document.getElementById("chkParedes").onchange = ev => { paredes.visible = ev.target.checked; };
document.getElementById("chkArestas").onchange = ev => todasArestas.forEach(e => e.visible = ev.target.checked);

// câmeras
const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()), R = Math.max(s.x, s.y, s.z);
const CAMS = {
  "Perspectiva": [c.x + R * 0.9, c.y + R * 0.8, c.z + R * 1.1],
  "Topo": [c.x, c.y + R * 2.2, c.z + 1],
  "Frente (Y)": [c.x, c.y, c.z + R * 1.8],
  "Fundo (Y)": [c.x, c.y, c.z - R * 1.8],
  "Lado (X)": [c.x + R * 1.8, c.y, c.z],
};
const divC = document.getElementById("cams");
for (const [nome, pos] of Object.entries(CAMS)) {
  const b = document.createElement("button"); b.textContent = nome;
  b.onclick = () => { camera.position.set(...pos); controls.target.copy(c); controls.update(); };
  divC.appendChild(b);
}
camera.position.set(...CAMS["Perspectiva"]); controls.target.copy(c); controls.update();

// hover
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), info = document.getElementById("info");
let destaque = null;
renderer.domElement.addEventListener("pointermove", ev => {
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(alvos.filter(a => a.parent.visible), false)[0];
  if (destaque) destaque.material.emissive.setHex(0x000000);
  destaque = hit ? hit.object : null;
  if (destaque) {
    destaque.material.emissive.setHex(0x333300);
    const p = destaque.userData;
    info.textContent = `#${p.id} ${p.grupo} - ${p.nome} · ${p.comprimento} x ${p.largura} x ${p.espessura} · ${p.material}` +
      ` · pos. x ${p.x} y ${p.y} z ${p.z}` + (p.fita ? ` · fita: ${p.fita}` : "") + (p.obs ? ` · ${p.obs}` : "");
  }
});

function redimensionar() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", redimensionar); redimensionar();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
